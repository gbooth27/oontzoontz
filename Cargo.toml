[package]
name = "oontzoontz"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Grug-simple music maker: beats, synths and your voice."
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.23"
cpal = "0.18"
crossbeam-channel = "0.5"
eframe = "0.37"
hound = "3.5"
rfd = "0.17"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio code has to be fast even in debug builds, or it crackles.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
